openapi: 3.1.0
info:
  title: 2bGreen grid-intelligence read API (K2)
  version: 1.0.0
  description: |
    Internal read API of `grid-intelligence`. `platform` never reads schema `grid`: it calls this API.
    A change to this file goes through a PR that tags all three of us.

    **Internal only.** No authentication. The service must stay on the Docker network and must never be
    exposed through a public route (risk-matrix entry).

    Payload = the K1 event payload (`docs/contracts/events.md`, section 4) plus `quality` and `storedAt`.
    Missing values are `null` or absent, never `0`. Consumers must accept both forms and ignore unknown fields.

    Endpoint status (`x-status`):
    - **frozen**: built, the contract will not change without a PR tagging all three.
    Since G8 every endpoint below is frozen: `latest` and ranges, for the nation and for a region.

    Decided in G8:
    - **Range limit**: at most 366 days between `from` and `to`. A wider request is refused with
      `400 INVALID_PARAMETER`, never cut, so a client cannot take a partial answer for a complete one. No pagination.
    - **Grain of range results**: 30 min, from the merged view (G4). `from` and `to` apply to the start of each
      period. Provisional rows are the average of their quarter-hours (not yet verified against cons-def, see
      docs/data/merged-view.md). `latest` stays on the speed layer (15 min).
    - **Region `code`**: the INSEE code as ODRE sends it, two digits (`76`). Only the format is checked: anything else
      is `404 SCOPE_UNKNOWN`, a well-formed code without data is `404 NO_DATA` (latest) or an empty range.

    Still open: a `GET /scopes` endpoint, if a client needs the list of regions.
servers:
  - url: http://localhost:8081
    description: Local development. Internal network only.
security: []
tags:
  - name: national
    description: National snapshots.
  - name: regions
    description: Reserved, not frozen.
paths:
  /api/v1/national/snapshots/latest:
    get:
      tags: [national]
      operationId: getLatestNationalSnapshot
      x-status: frozen
      summary: Latest national snapshot with measures
      description: |
        The most recent period that has measures. A forecast-only row (future period, or recent period not yet
        processed) is never returned: the test is the same as in K1, the row has a measured consumption.
        `quality` is practically always `PROVISIONAL`, because the speed layer is newer than the batch.
      responses:
        '200':
          description: The latest snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
              examples:
                normal:
                  summary: All values present
                  externalValue: ./examples/latest-national.json
                missingValues:
                  summary: Some values null, some absent
                  externalValue: ./examples/latest-national-missing-values.json
        '404':
          description: No snapshot with measures yet. Normal on a fresh start.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                noData:
                  externalValue: ./examples/error-no-data.json
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/national/snapshots:
    get:
      tags: [national]
      operationId: getNationalSnapshots
      x-status: frozen
      summary: National snapshots in a time range
      description: |
        Rows are ordered by `observedAt` ascending, at 30-min grain (merged view). For a given period the batch row
        wins over the provisional one, so a range can mix the three qualities. A period with no data is absent:
        nothing is filled in. An empty range is `200` with `items: []`. At most 366 days between `from` and `to`.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Snapshots of the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRange'
              examples:
                mixedQuality:
                  summary: One row per quality (abridged, rows are not contiguous)
                  externalValue: ./examples/range-national.json
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/regions/{code}/snapshots/latest:
    get:
      tags: [regions]
      operationId: getLatestRegionSnapshot
      x-status: frozen
      summary: Latest snapshot of a region
      description: |
        The `scope` field of the body is `region:<code>`, as on Kafka. Regional data has no CO2 measure or forecast:
        `co2Intensity` is `null` until the regional estimate exists (G7), which will set `estimated: true`.
      parameters:
        - $ref: '#/components/parameters/RegionCode'
      responses:
        '200':
          description: The latest snapshot of the region.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
              examples:
                region:
                  summary: Regional shape
                  externalValue: ./examples/regions-latest-draft.json
        '404':
          description: |
            `NO_DATA`: the region code is well formed but has no snapshot with measures yet.
            `SCOPE_UNKNOWN`: the region code is not an INSEE region code (not two digits).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                noData:
                  externalValue: ./examples/error-no-data.json
                scopeUnknown:
                  externalValue: ./examples/error-scope-unknown.json
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/regions/{code}/snapshots:
    get:
      tags: [regions]
      operationId: getRegionSnapshots
      x-status: frozen
      summary: Snapshots of a region in a time range
      description: |
        Same rules as the national range endpoint. The region is checked first: a malformed code is `404
        SCOPE_UNKNOWN` whatever `from` and `to` say. A well-formed code without data is `200` with `items: []`.
        Regional batch data does not exist yet (G6), so every row is `PROVISIONAL` for now.
      parameters:
        - $ref: '#/components/parameters/RegionCode'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Snapshots of the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotRange'
              examples:
                region:
                  summary: Two periods of a region (abridged)
                  externalValue: ./examples/range-region.json
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          description: '`SCOPE_UNKNOWN`: the region code is not recognised.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                scopeUnknown:
                  externalValue: ./examples/error-scope-unknown.json
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    From:
      name: from
      in: query
      required: true
      description: Start of the range, **inclusive**. UTC, ISO-8601 with `Z`.
      schema:
        type: string
        format: date-time
        examples: ['2026-10-20T00:00:00Z']
    To:
      name: to
      in: query
      required: true
      description: |
        End of the range, **exclusive**. UTC, ISO-8601 with `Z`. Must be after `from`, and at most 366 days after it.
        A period is part of the range when its start is in `[from, to)`.
      schema:
        type: string
        format: date-time
        examples: ['2026-10-21T00:00:00Z']
    RegionCode:
      name: code
      in: path
      required: true
      description: "Region code, ODRE's `code_insee_region` as is (two digits)."
      schema:
        type: string
        examples: ['76']
  responses:
    InvalidParameter:
      description: |
        `from` or `to` missing or not a UTC date-time, `from` not before `to`, or a range wider than 366 days.
        Code `INVALID_PARAMETER`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidParameter:
              externalValue: ./examples/error-invalid-parameter.json
            rangeTooLarge:
              externalValue: ./examples/error-range-too-large.json
    InternalError:
      description: Unexpected failure. Code `INTERNAL_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              externalValue: ./examples/error-internal.json
    Unavailable:
      description: Database or service not ready. Code `SERVICE_UNAVAILABLE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              externalValue: ./examples/error-unavailable.json
  schemas:
    Snapshot:
      type: object
      description: |
        One reading of one scope. Same fields as the K1 payload, plus `quality` and `storedAt`.
        Every measure may be `null` or absent. A missing value is never `0`.
      required: [schemaVersion, scope, observedAt, quality, estimated, storedAt]
      properties:
        schemaVersion:
          type: integer
          const: 1
        scope:
          type: string
          description: '`national`, later `region:<code>`. Same value as the Kafka key. Not the URL syntax.'
          examples: [national]
        observedAt:
          type: string
          format: date-time
          description: UTC, ISO-8601 with `Z`, start of the period (15 or 30 min).
        co2Intensity:
          type: [number, 'null']
          description: gCO2eq/kWh. Estimated for regions (see `estimated`).
        consumption:
          type: [integer, 'null']
          description: MW.
        consumptionForecastDay:
          type: [integer, 'null']
          description: MW. Forecast of consumption, not of CO2.
        consumptionForecastDayBefore:
          type: [integer, 'null']
          description: MW. Same, issued the day before.
        production:
          $ref: '#/components/schemas/Production'
        pumping:
          type: [integer, 'null']
          maximum: 0
          description: MW drawn from the grid to pump water uphill. Zero or negative. A positive value is a bug.
        quality:
          $ref: '#/components/schemas/Quality'
        estimated:
          type: boolean
          description: '`true` when CO2 is estimated (regional). `false` for national.'
        storedAt:
          type: string
          format: date-time
          description: UTC time the row was written. Gives the freshness of the data and reveals a stalled pipeline.
    Production:
      type: object
      description: Production by source, MW. Each field may be `null` or absent.
      properties:
        nuclear:
          type: [integer, 'null']
        gas:
          type: [integer, 'null']
          description: National only.
        coal:
          type: [integer, 'null']
          description: National only.
        oil:
          type: [integer, 'null']
          description: National only.
        thermal:
          type: [integer, 'null']
          description: Total of fossil production, set when the source gives only the aggregate (regional data).
        wind:
          type: [integer, 'null']
          description: Onshore plus offshore.
        solar:
          type: [integer, 'null']
        hydro:
          type: [integer, 'null']
        bioenergy:
          type: [integer, 'null']
    Quality:
      type: string
      enum: [PROVISIONAL, CONSOLIDATED, DEFINITIVE]
      description: |
        `PROVISIONAL` comes from the speed layer, `CONSOLIDATED` and `DEFINITIVE` from the batch layer.
    SnapshotRange:
      type: object
      required: [scope, from, to, items]
      properties:
        scope:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        items:
          type: array
          description: Ascending by `observedAt`. Empty when nothing is stored in the range.
          items:
            $ref: '#/components/schemas/Snapshot'
    Problem:
      type: object
      description: RFC 7807 Problem Details, with a stable `code` extension.
      required: [title, status, code]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum: [INVALID_PARAMETER, NO_DATA, SCOPE_UNKNOWN, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
          description: |
            Clients switch on `code`, not on `title`.
            `NO_DATA` means "nothing to show" and is normal on a fresh start.
            `SCOPE_UNKNOWN` means the caller asked for something that does not exist: a bug on the caller side.
