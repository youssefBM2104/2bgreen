spring.application.name=platform
server.port=8080

# TimescaleDB (same container, its own schema)
spring.datasource.url=jdbc:postgresql://localhost:5432/2bgreen
spring.datasource.username=${DB_USER:platform_app}
spring.datasource.password=${DB_PASSWORD:platform_dev}

spring.flyway.schemas=platform
spring.flyway.default-schema=platform
spring.flyway.create-schemas=false

spring.kafka.bootstrap-servers=localhost:9092

# Keycloak: Spring only contacts this URL on the first authenticated request,
# so the app starts fine without it.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/2bgreen

management.endpoints.web.exposure.include=health,info

# Source of grid data (advisory): rest = read API of grid-intelligence, stub = fixed K2 example, FAKE data (F4)
grid.client.mode=rest
grid.client.base-url=http://localhost:8081
grid.client.connect-timeout=2s
# Above the 3 s database timeout of grid-intelligence, so its own 503 arrives first
grid.client.read-timeout=5s

# Citizen traffic light (F5), gCO2eq/kWh. A value equal to a limit belongs to the worse colour.
# Proposed from 6,234 national readings (2026-09-01 to 2026-11-04, median 24, max 65): about 40% green, 35% amber,
# 25% red. To validate as a team, and to re-check in winter: autumn data only.
# The stream computes the same bands for grid.band-changed (G9): stream.band.* in grid-intelligence must stay equal.
advisory.traffic-light.green-below=20
advisory.traffic-light.amber-below=40
# Older than this, the light shows no colour. ODRÉ publishes with 30-60 min of lag and the poller runs every 15 min.
advisory.traffic-light.max-age=PT2H

# Rule engine (P8). It reads grid.snapshot-stored (K1) as group platform-rules.
# earliest: a first start reads the 7 days kept by the topic, so nothing is skipped. Old snapshots only build the
# state of the rules, they notify nobody (max-snapshot-age).
spring.kafka.consumer.auto-offset-reset=earliest
# Debounce: after a notification, the same rule or webhook stays silent this long, then fires if its condition is
# still met. Proposal, to validate as a team. PT0S turns it off.
automation.rules.min-interval=PT1H
# Same idea as advisory.traffic-light.max-age: an older snapshot does not describe the grid right now.
automation.rules.max-snapshot-age=PT2H
