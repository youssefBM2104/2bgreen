# Poller (profile `poller`, D6). Durations are ISO-8601 (PT15M = 15 minutes).
# National: one poll every 15 min = 4 ODRÉ calls per hour in normal operation (one page per poll).
poller.interval=PT15M
poller.initial-delay=PT0S
# Each poll starts again 1 h (4 rows) before the last reading seen: catches late or revised rows, costs no call.
poller.overlap=PT1H
# Empty database: start at the oldest row of eco2mix-national-tr (2026-09-01 00:00 Paris), where cons-def ends.
# One-time backfill of about 50 calls.
poller.first-start=2026-08-31T22:00:00Z

# Regional poll (G1). ODRÉ refreshes eco2mix-regional-tr hourly (to confirm), so one poll per hour is enough.
poller.regional-interval=PT1H
# Wider than the national overlap: the 12 regions are not filled in at the same pace, a region late by less than
# this is still caught. Rows with no measure never move the cursor, so they are asked for again anyway.
poller.regional-overlap=PT3H
# Two scheduled polls (national, regional): the one-time regional backfill must not delay the national poll.
spring.task.scheduling.pool.size=2
#
# ODRÉ calls per month (quota 50,000), in normal operation:
#   national: 4 polls/h x 24 x 30 x 1 call                     =  2,880
#   regional: 1 poll/h x 24 x 30 x ~3 calls (window ~4 h = ~16 periods x 12 regions = ~190 rows, 100 per page,
#             full pages hold 8 whole periods)                  = ~2,160
#   total                                                       = ~5,040 (about 10 %)
# One-time regional backfill on an empty database: 50 days x 96 periods x 12 regions = 57,600 rows
# = ~600 calls (about 1 % of the quota).
