# Poller (profile `poller`, D6). Durations are ISO-8601 (PT15M = 15 minutes).
# One poll every 15 min = 4 ODRÉ calls per hour in normal operation (one page per poll).
poller.interval=PT15M
poller.initial-delay=PT0S
# Each poll starts again 1 h (4 rows) before the last reading seen: catches late or revised rows, costs no call.
poller.overlap=PT1H
# Empty database: start at the oldest row of eco2mix-national-tr (2026-09-01 00:00 Paris), where cons-def ends.
# One-time backfill of about 50 calls.
poller.first-start=2026-08-31T22:00:00Z
