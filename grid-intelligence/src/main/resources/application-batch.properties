# Batch layer (profile `batch`, G3). Durations are ISO-8601 (PT24H = 24 hours).
# One run a day, the first at startup. A run costs ONE ODRÉ call when nothing changed (the counts per year and
# nature), which is the normal case: cons-def only grows in monthly jumps and flips a year to definitive once.
batch.interval=PT24H
batch.initial-delay=PT0S
#
# ODRÉ calls (quota 50,000 per month and per dataset, every request counts, HEAD included):
#   normal day:       1 call                                    =    ~30 per month
#   initial load:     1 count + 1 export per year (2011-2026)   =     ~17 calls, once
#   year flips to definitive: 1 count + 2 exports (the year and the previous UTC year's last hour)
# Same dataset as nothing else in the app: the speed layer reads the `-tr` datasets.
#
# With `poller,stream,batch` in one process, the two pollers and the batch are three scheduled tasks: the first load
# of the batch must not hold a poll back, so give the scheduler 3 threads (the poller profile sets 2).
spring.task.scheduling.pool.size=3
