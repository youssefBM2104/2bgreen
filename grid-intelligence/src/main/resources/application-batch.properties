# Batch layer (profile `batch`, G3). Durations are ISO-8601 (PT24H = 24 hours).
# One run a day, the first at startup. A run costs ONE ODRÉ call when nothing changed (the counts per year and
# nature), which is the normal case: cons-def only grows in monthly jumps and flips a year to definitive once.
batch.interval=PT24H
batch.initial-delay=PT0S
#
# ODRÉ calls (quota 50,000 per month and per dataset, every request counts, HEAD included):
#   normal day:       1 call                                    =    ~30 per month
#   initial load:     1 count + 1 export per year (2011-2026)   =     ~17 calls, once
#   year flips to definitive: 1 count + 2 exports (the year and the previous UTC year's last hour)
# Same dataset as nothing else in the app: the speed layer reads the `-tr` datasets.
#
#
# Regional batch (G6), eco2mix-regional-cons-def, same rhythm and same rules, its own sync state (key `regional`).
# Loaded from this UTC year on (the issue asks for 2021+; the dataset goes back to 2013).
#   normal day:       1 call (counts of all regions)            =    ~30 per month
#   initial load:     1 count + 1 export per year (2021-2026)   =      7 calls, once (~210,000 rows a year)
batch.regional.first-year=2021
# Regions loaded, INSEE codes separated by commas; empty = all 12. ODRÉ builds a regional year in about 18 minutes for
# all regions, in a few seconds for one (measured 2026-11-12: region 93, 2025, 17,519 rows in 6 s). Counts and exports
# use the same filter. Changing it later reloads the years once (the counts differ); rows already stored stay.
batch.regional.regions=
#
# With `poller,stream,batch` in one process, the two pollers and the two batches are four scheduled tasks: a first
# load must not hold a poll back, so give the scheduler 4 threads (the poller profile sets 2).
spring.task.scheduling.pool.size=4
