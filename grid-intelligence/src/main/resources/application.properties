spring.application.name=grid-intelligence
server.port=8081

# TimescaleDB (container 2bgreen-timescaledb)
spring.datasource.url=jdbc:postgresql://localhost:5432/2bgreen
spring.datasource.username=${DB_USER:grid_app}
spring.datasource.password=${DB_PASSWORD:grid_dev}

# Flyway: own schema + own history table, so it never collides with the platform app later
spring.flyway.schemas=grid
spring.flyway.default-schema=grid
spring.flyway.create-schemas=false

# Kafka (EXTERNAL listener, the host-side one)
spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info

# ODRÉ Explore v2.1 (D3). Tests override the base URL with a local fake server, never the real API.
odre.base-url=https://odre.opendatasoft.com/api/explore/v2.1
odre.connect-timeout=5s
odre.read-timeout=20s
odre.page-size=100
