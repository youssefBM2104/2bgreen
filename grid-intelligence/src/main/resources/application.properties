spring.application.name=grid-intelligence
server.port=8081

# TimescaleDB (container 2bgreen-timescaledb)
spring.datasource.url=jdbc:postgresql://localhost:5432/2bgreen
spring.datasource.username=${DB_USER:grid_app}
spring.datasource.password=${DB_PASSWORD:grid_dev}
# Hikari waits 30 s for a connection by default: a database outage must give the API a 503 within a few seconds.
# Milliseconds (Hikari's property is a long, not a Duration).
spring.datasource.hikari.connection-timeout=3000

# Flyway: own schema + own history table, so it never collides with the platform app later
spring.flyway.schemas=grid
spring.flyway.default-schema=grid
spring.flyway.create-schemas=false

# Kafka (EXTERNAL listener, the host-side one)
spring.kafka.bootstrap-servers=localhost:9092

management.endpoints.web.exposure.include=health,info

# ODRÉ Explore v2.1 (D3). Tests override the base URL with a local fake server, never the real API.
odre.base-url=https://odre.opendatasoft.com/api/explore/v2.1
odre.connect-timeout=5s
odre.read-timeout=20s
odre.page-size=100
# Whole-year exports of the batch (G3, G6): a year is one long download, slow on ODRÉ's side, minutes for a regional
# year: on 2026-11-11 the 2021 regional export (57 MB, 210,240 rows) took 18.6 min, first byte after 2 s. With the
# 20 s of odre.read-timeout every export failed, national included. Only the batch uses this; pollers keep 20 s.
odre.export-read-timeout=PT1H
