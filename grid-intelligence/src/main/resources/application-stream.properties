# Kafka Streams (profile `stream`). The application id is also the consumer group (contract K1: `grid-stream`).
spring.kafka.streams.application-id=grid-stream

# Shared CO2 band per scope (G9), gCO2eq/kWh. A value equal to a limit belongs to the worse band.
# MUST equal advisory.traffic-light.green-below / amber-below in platform (F5): the two apps cannot share code.
stream.band.green-below=20
stream.band.amber-below=40
