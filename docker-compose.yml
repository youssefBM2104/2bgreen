name: 2bgreen

services:
  timescaledb:
    image: timescale/timescaledb:2.18.2-pg17
    container_name: 2bgreen-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: 2bgreen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      GRID_APP_PASSWORD: ${GRID_APP_PASSWORD:-grid_dev}
      PLATFORM_APP_PASSWORD: ${PLATFORM_APP_PASSWORD:-platform_dev}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:4.0.0
    container_name: 2bgreen-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.0
    container_name: 2bgreen-keycloak
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/2bgreen-realm.json:/opt/keycloak/data/import/2bgreen-realm.json:ro
volumes:
  timescale-data:
  kafka-data:
  keycloak-data: