<mat-toolbar class="header">
  <a class="brand" routerLink="/">2bGreen</a>
  <nav aria-label="Espaces">
    @for (link of links(); track link.path) {
      <a mat-button [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
        {{ link.label }}
      </a>
    }
  </nav>
  @if (auth.isLoggedIn()) {
    <div class="account">
      @if (hasNotifications()) {
        <!-- Chargée à part : le menu et la pastille Material ne pèsent pas sur le premier affichage. -->
        @defer (on immediate) {
          <app-notification-bell />
        }
      }
      <button mat-button class="logout" type="button" (click)="auth.logout()">
        Se déconnecter
      </button>
    </div>
  }
</mat-toolbar>

<main>
  <router-outlet />
</main>

<footer>2bGreen · données RTE éCO2mix via ODRÉ</footer>
